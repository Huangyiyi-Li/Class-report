name: Windows Recorder CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/windows-recorder.yml"
      - "electron-recorder/**"
      - "windows_client/xxt_upload.py"
      - "windows_client/test_timeouts.py"
  push:
    branches:
      - master
      - feat/windows-recorder-production
    tags:
      - "recorder-v*"
    paths:
      - ".github/workflows/windows-recorder.yml"
      - "electron-recorder/**"
      - "windows_client/xxt_upload.py"
      - "windows_client/test_timeouts.py"

concurrency:
  group: windows-recorder-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: electron-recorder
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: electron-recorder/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: electron-recorder/worker/requirements-build.txt

      - name: Install Python dependencies
        run: python -m pip install -r worker/requirements-build.txt

      - name: Install Node.js dependencies
        run: npm ci

      - name: Check quality-gate formatting
        run: npx prettier --check ../.github/workflows/windows-recorder.yml ../.lintstagedrc ../.prettierrc package.json src/engineering-gates.test.js

      - name: Run Python checks
        run: python -m pytest worker ../windows_client/test_timeouts.py -q

      - name: Run Node.js checks
        run: npm test

      - name: Install Windows FFmpeg
        run: |
          choco install ffmpeg -y --no-progress
          $ffmpeg = (Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg\tools" -Filter ffmpeg.exe -Recurse | Select-Object -First 1).FullName
          if (-not $ffmpeg) { throw "ffmpeg.exe was not installed" }
          "FFMPEG_EXE=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare FFmpeg packaging input
        run: |
          New-Item -ItemType Directory -Force build/ffmpeg | Out-Null
          Copy-Item $env:FFMPEG_EXE build/ffmpeg/ffmpeg.exe -Force

      - name: Build recorder worker
        run: python scripts/build-worker.py

      - name: Build desktop interface
        run: npm run build

      - name: Build NSIS and portable installers
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Verify packaged resources
        run: |
          $worker = Get-ChildItem release -Filter ClassroomRecorderWorker.exe -Recurse
          $ffmpeg = Get-ChildItem release -Filter ffmpeg.exe -Recurse
          $installers = Get-ChildItem release -Filter *.exe | Where-Object { $_.Name -match "Setup|Portable" }
          if (-not $worker) { throw "Packaged worker is missing" }
          if (-not $ffmpeg) { throw "Packaged FFmpeg is missing" }
          if ($installers.Count -lt 2) { throw "Expected both Setup and Portable installers" }

      - name: Run packaged application smoke test
        run: |
          $app = Get-ChildItem release/win-unpacked -Filter *.exe | Select-Object -First 1
          if (-not $app) { throw "Packaged desktop executable is missing" }
          $env:ELECTRON_SMOKE_TEST = "1"
          $env:BINDING_SERVICE_MODE = "mock"
          $stdout = Join-Path $env:RUNNER_TEMP "recorder-smoke.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "recorder-smoke.stderr.log"
          $process = Start-Process -FilePath $app.FullName -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id -Force
            throw "Packaged desktop application did not finish its smoke test"
          }
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Packaged desktop smoke test failed with exit code $($process.ExitCode)" }

      - name: Run packaged normal-start test
        run: |
          $app = Get-ChildItem release/win-unpacked -Filter *.exe | Select-Object -First 1
          if (-not $app) { throw "Packaged desktop executable is missing" }
          & ./scripts/test-packaged-normal-start.ps1 -AppPath $app.FullName

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: classroom-recorder-windows-${{ github.sha }}
          path: electron-recorder/release/*.exe
          if-no-files-found: error
          retention-days: 14

  publish-github-prerelease:
    if: startsWith(github.ref, 'refs/tags/recorder-v')
    needs: build-windows-installer
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: classroom-recorder-windows-${{ github.sha }}
          path: release

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = Get-ChildItem release -Filter *.exe | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME $assets --verify-tag --prerelease --title "课堂录音采集助手 $env:GITHUB_REF_NAME" --notes "Windows 10/11 测试版。优先下载 Setup 安装版；Portable 为免安装版。"
